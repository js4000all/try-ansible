---
- name: Configure network
  hosts: all
  become: true
  serial: 1

  pre_tasks:
    - name: Validate required host variables
      ansible.builtin.assert:
        that:
          - network_interface is defined
          - network_ipv4_address is defined
        fail_msg: >-
          network_interface and network_ipv4_address
          must be defined for {{ inventory_hostname }}.

  roles:
    - network

  post_tasks:
    - name: Reboot to apply network configuration
      ansible.builtin.shell: "sleep 2 && reboot"
      async: 1
      poll: 0
      when:
        - network_changed | default(false)
        - not ansible_check_mode

    - name: Wait for SSH port on static IP
      ansible.builtin.wait_for:
        host: "{{ network_ipv4_address }}"
        port: 22
        timeout: 300
        state: started
      delegate_to: localhost
      become: false
      when: not ansible_check_mode

    - name: Switch Ansible connection to static IP
      ansible.builtin.set_fact:
        ansible_host: "{{ network_ipv4_address }}"
      when: not ansible_check_mode

    - name: Reset SSH connection
      ansible.builtin.meta: reset_connection

    - name: Wait for Ansible connection on static IP
      ansible.builtin.wait_for_connection:
        timeout: 60
      when: not ansible_check_mode
