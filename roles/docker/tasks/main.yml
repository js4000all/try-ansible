---
- name: Verify data disk is mounted
  ansible.builtin.assert:
    that:
      - data_disk_mount_path in ansible_facts.mounts | map(attribute='mount') | list
    fail_msg: "{{ data_disk_mount_path }} is not mounted"

- name: Install Docker
  ansible.builtin.import_tasks: install.yml

- name: Configure Docker storage
  ansible.builtin.import_tasks: storage.yml

- name: Configure Docker services
  ansible.builtin.import_tasks: service.yml
