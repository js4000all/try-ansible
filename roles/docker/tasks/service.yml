---
- name: Create containerd systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: "0755"

- name: Require data disk for containerd
  ansible.builtin.copy:
    dest: /etc/systemd/system/containerd.service.d/storage.conf
    content: |
      [Unit]
      RequiresMountsFor={{ data_disk_mount_path }}
    mode: "0644"
  register: docker_containerd_storage_override

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Require data disk for Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/storage.conf
    content: |
      [Unit]
      RequiresMountsFor={{ data_disk_mount_path }}
    mode: "0644"
  register: docker_storage_override

- name: Reload systemd configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >
    docker_containerd_storage_override.changed or
    docker_storage_override.changed

- name: Stop Docker socket for storage reconfiguration
  ansible.builtin.systemd_service:
    name: docker.socket
    state: stopped
  when: docker_storage_restart_required

- name: Stop Docker for storage reconfiguration
  ansible.builtin.systemd_service:
    name: docker
    state: stopped
  when: docker_storage_restart_required

- name: Stop containerd for storage reconfiguration
  ansible.builtin.systemd_service:
    name: containerd
    state: stopped
  when: docker_storage_restart_required

- name: Enable and start containerd service
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Enable and start Docker socket
  ansible.builtin.systemd_service:
    name: docker.socket
    enabled: true
    state: started

- name: Enable and start Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
