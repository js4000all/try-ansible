---

- name: Configure network interfaces
  ansible.builtin.template:
    src: alpine_interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: network_interfaces_result

- name: Configure DNS resolver
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: network_dns_result

- name: Set network changed flag
  ansible.builtin.set_fact:
    network_changed: >-
      {{
        network_interfaces_result.changed
        or network_dns_result.changed
      }}
