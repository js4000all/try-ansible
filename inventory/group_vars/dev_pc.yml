# group_vars/dev_pc.yml
ansible_become_method: sudo
ansible_user: user1
ansible_python_interpreter: /usr/bin/python3

data_disk_mount_path: /data
docker_data_root: "{{ data_disk_mount_path }}/docker"
containerd_root: "{{ data_disk_mount_path }}/containerd"

git_config:
  init.defaultBranch: main
  pull.ff: only
  alias.s: "status -s"
  alias.b: branch
  alias.sw: switch
  alias.p: "push --force-with-lease --force-if-includes"
  alias.fe: "fetch --prune"
